# This is an example ZestWM config file.
# Refer to the wiki for more information.

# Please note not all available settings / options are set here.
# For a full list, see the wiki
# Workspace syntax currently supported here: docs/config/workspaces.md

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/zestwm/keybindings.conf



font = monospace:size=10

layout = tree [T]
layout = monocle [M]

# Workspace definitions (workspace-first):
# - workspace = <name>              -> append new workspace with that name
# - workspace = <id>, <name>        -> set/override workspace name at explicit id
workspace = web
workspace = 3, code
workspace = 5, chat

general {
    resize_hints = true
    # Global window border colors (active/inactive).
    col.active_border = #005577
    col.inactive_border = #444444
    # Strength of dim layer behind special overlay (0 = off, default 0.2). Needs a compositor for real transparency.
    dim_special = 0.2
}

group {
    # Focus after closing the active tab. Default: history (prev_active, then previous, then next).
    # Values: history | previous | next | first | last | leave
    # See docs/config/group.md
    # focus_removed_window = history
    # Empty-drop peel out of a multi-tab group (default true). See docs/config/group.md
    # drag_out_of_group = true
    groupbar {
        # Groupbar has dedicated colors independent from global border colors.
        col.active = #eeeeee
        col.inactive = #bbbbbb
        col.background = #222222
    }
}

# Key bindings (niri-style `binds { ... }` only).
# $name expands in MODS, KEY, and args. MODS: SUPER+SHIFT, SUPER SHIFT, SUPER_SHIFT, SUPER|SHIFT. Aliases: exec→spawn,
# workspace→view,
# killactive→killclient, fullscreen→togglefullscreen; movefocus l|r|u|d; swapwindow l|r|u|d (tree, tiled);
# workspace e+1 / e-1.
# keysym code:N = raw X keycode (8–255). XF86Audio* / XF86MonBrightness* names supported.

# Niri-style binds block (canonical bind syntax).
binds {
    Alt+Shift+Return { spawn st; }
    Alt+Shift+q { quit; }
    Alt+j { cyclefocus 1; }
    Alt+k { cyclefocus -1; }
    Alt+Shift+c { killclient; }
    Alt+t { setlayout 0; }
    Alt+m { setlayout 1; }
    Alt+space { cyclelayout 1; }
    Alt+Shift+space { togglefloating; }
    Alt+p repeat=false { spawn notify-send "pressed on release"; }
    Alt+x allow-inhibiting=false { spawn notify-send "non consuming bind"; }
    Alt+Tab { cyclenext; }
    Alt+Shift+Tab { cycleprev; }
    Alt+Return repeat=false cooldown-ms=500 { spawn alacritty; }
    AltGr+j { cyclefocus 1; }
    Alt+MouseLeft { movewindow; }
    Alt+MouseRight { resizewindow; }
    Alt+WheelScrollDown cooldown-ms=150 { cyclefocus 1; }

    XF86AudioRaiseVolume { spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+; }
}

# Window rules: niri-style `window-rule { ... }` only — see docs/config/window-rules.md
# Example:
# window-rule {
#     match app-id="^MyApp$"
#     open-floating = true
# }
